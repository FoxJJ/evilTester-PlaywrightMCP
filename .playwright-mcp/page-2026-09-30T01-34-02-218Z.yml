          - paragraph [ref=f19e312]: Grammar Data Gen is a pair of deliberately buggy text generation apps for practicing exploratory testing, test modelling, and browser automation.
          - paragraph [ref=f19e313]: The apps generate random text from small grammar definitions. They are intentionally imperfect, so use them to compare expected grammar behaviour with what the page actually does.
          - heading "Versions" [level=2] [ref=f19e314]
          - paragraph [ref=f19e315]:
            - link "Grammar Data Gen - Basic" [ref=f19e316] [cursor=pointer]:
              - /url: /apps/grammar-data-gen/basic/
            - text: uses one text area of template lines with bracketed options such as
            - code [ref=f19e317]: "[one, two, three]"
            - text: . It is the simpler exercise and is useful for practicing line selection, option parsing, click behaviour, and form behaviour.
          - generic [ref=f19e319]:
            - button "Copy to clipboard" [ref=f19e320] [cursor=pointer]: 
