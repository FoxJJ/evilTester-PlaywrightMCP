                - listitem [ref=f25e347]: to calculate the result of a single operation (plus, minus, times, divide)
            - listitem [ref=f25e348]:
              - code [ref=f25e349]: sequence
              - list [ref=f25e350]:
                - listitem [ref=f25e351]: to calculate the result of a sequence of operations where the result of the previous sequence is fed through into the next operation.
          - heading "Calculate" [level=2] [ref=f25e352]
          - paragraph [ref=f25e353]:
            - text: The
            - code [ref=f25e354]: calculate
            - text: "end point:"
          - list [ref=f25e355]:
            - listitem [ref=f25e356]:
              - code [ref=f25e357]: /apps/api/calculator/calculate
          - paragraph [ref=f25e358]:
            - text: Accepts
            - code [ref=f25e359]: POST
            - text: and
            - code [ref=f25e360]: GET
            - text: requests.
          - paragraph [ref=f25e361]:
            - text: These can be either
            - code [ref=f25e362]: application/json
            - text: or
            - code [ref=f25e363]: application/x-www-form-urlencoded
          - heading "Form Encoded Payload" [level=3] [ref=f25e364]
          - paragraph [ref=f25e365]:
            - text: If using the
            - code [ref=f25e366]: application/x-www-form-urlencoded
            - text: "content then the parameters are the same as those used by the Simple Calculator application:"
          - list [ref=f25e367]:
            - listitem [ref=f25e368]:
              - code [ref=f25e369]: number1
            - listitem [ref=f25e370]:
              - code [ref=f25e371]: number2
            - listitem [ref=f25e372]:
              - code [ref=f25e373]: function
          - heading "JSON Payload" [level=3] [ref=f25e374]
          - paragraph [ref=f25e375]: "If using the JSON format then use the following format:"
          - code [ref=f25e377]: "{ \"operation\": \"plus\", \"left\": \"1\", \"right\": \"2\" }"
          - heading "Operands input format" [level=4] [ref=f25e378]
          - paragraph [ref=f25e379]: "There is also an additional input format, instead of supplying a left and right value, supply a list of operands:"
          - code [ref=f25e381]: "{ \"operation\": \"plus\", \"operands\": [ \"1\", \"2\", \"3\"] }"
          - heading "Query Format" [level=3] [ref=f25e382]
          - paragraph [ref=f25e383]:
            - text: For a
            - code [ref=f25e384]: GET
            - text: "request, the values need to be encoded into the request as query params:"
          - paragraph [ref=f25e385]:
            - text: e.g.
            - code [ref=f25e386]: .../calculate?operation=plus&left=1&right=2
          - paragraph [ref=f25e387]: "Params:"
          - list [ref=f25e388]:
            - listitem [ref=f25e389]:
              - code [ref=f25e390]: operation
              - text: e.g.
              - code [ref=f25e391]: plus
              - text: ","
              - code [ref=f25e392]: minus
              - text: ", etc."
            - listitem [ref=f25e393]:
              - code [ref=f25e394]: left
              - text: e.g. 1
            - listitem [ref=f25e395]:
              - code [ref=f25e396]: right
              - text: e.g. 2
            - listitem [ref=f25e397]:
              - code [ref=f25e398]: operands
              - text: e.g.
              - code [ref=f25e399]: "[1, 2]"
          - heading "JSON response" [level=2] [ref=f25e400]
          - heading "Success" [level=3] [ref=f25e401]
          - paragraph [ref=f25e402]: "The above would add 1 and 2 and respond with:"
          - code [ref=f25e404]: "{ \"type\": \"VALUE\", \"value\": \"3\" }"
          - heading "Error" [level=3] [ref=f25e405]
          - paragraph [ref=f25e406]: "Any errors result in an error response:"
          - code [ref=f25e408]: "{ \"type\": \"INPUT_ERROR\", \"value\": \"Unrecognised Operation: add valid values are (plus, times, minus, divide)\" }"
          - heading "Sequence" [level=2] [ref=f25e409]
          - paragraph [ref=f25e410]:
            - text: The
            - code [ref=f25e411]: sequence
            - text: "end point:"
          - list [ref=f25e412]:
            - listitem [ref=f25e413]:
              - code [ref=f25e414]: /apps/api/calculator/sequence
          - paragraph [ref=f25e415]:
            - text: Accepts
            - code [ref=f25e416]: POST
            - text: requests.
          - paragraph [ref=f25e417]:
            - text: These can be
            - code [ref=f25e418]: application/json
          - paragraph [ref=f25e419]:
            - text: To calculate
            - code [ref=f25e420]: (4 - 1) * 3
            - text: ":"
          - code [ref=f25e422]: "{\"operations\": [ { \"operation\": \"plus\", \"right\": 4 }, { \"operation\": \"minus\", \"right\": \"1\" }, { \"operation\": \"times\", \"right\": 3 } ]}"
          - paragraph [ref=f25e423]: "would result in:"
          - code [ref=f25e425]: "{ \"type\": \"VALUE\", \"value\": \"9\" }"
