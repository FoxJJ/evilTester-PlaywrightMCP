      - main [ref=f11e255]:
        - generic [ref=f11e256]:
          - heading "Fun and Games" [level=1] [ref=f11e257]
          - paragraph [ref=f11e259]: Playful applications and games for practicing exploratory testing, JavaScript hacking, and browser automation.
          - paragraph [ref=f11e260]: These applications are useful when you want a more playful testing target, or when you want to practice automation against small, stateful browser interactions.
          - paragraph [ref=f11e261]: Some games are deliberately buggy or hackable. Treat them as exploration targets and use the instructions for practice hints.
          - paragraph [ref=f11e262]:
            - text: The pages in the
            - link "Buggy Game category" [ref=f11e263] [cursor=pointer]:
              - /url: /categories/buggy-game/
            - text: are designed for exploratory testing, JavaScript investigation, canvas and keyboard interaction, state modelling, timing, synchronization, and automation of small game loops.
          - paragraph [ref=f11e264]: Pick a game, play it manually first, and build a model of how you think scoring, movement, and success should work. Then inspect the DOM and JavaScript to compare the implementation with your model.
