          - generic [ref=f8e246]:
            - paragraph [ref=f8e247]:
              - strong [ref=f8e248]: Practice Applications and Pages For Automating and Testing
            - paragraph [ref=f8e249]: This is a set of applications and example pages for practicing Automation, Software Testing, Web Automating, Exploratory Testing, and JavaScript Hacking.
            - paragraph [ref=f8e250]: Each page, challenge and application has an Instructions page with more information and activity hints. There is also a reference section with more detailed information about Testing and Automating.
          - paragraph [ref=f8e251]: "The site contains:"
          - list [ref=f8e252]:
            - listitem [ref=f8e253]:
              - text: Pages
              - list [ref=f8e254]:
                - listitem [ref=f8e255]: very focused examples of principles and approaches, these are useful for exploring concepts and techniques
            - listitem [ref=f8e256]:
              - text: Apps
              - list [ref=f8e257]:
                - listitem [ref=f8e258]: usually one page apps, but occasionally more, they present a functional example of web concepts and are designed to support exploratory testing, technical testing and automating.
            - listitem [ref=f8e259]:
              - text: Fun and Games
              - list [ref=f8e260]:
                - listitem [ref=f8e261]: playful applications and games for practicing exploratory testing, JavaScript hacking, and automation.
            - listitem [ref=f8e262]:
              - text: Tools
              - list [ref=f8e263]:
                - listitem [ref=f8e264]: small utilities and support applications that help with testing, data generation, and browser investigation.
            - listitem [ref=f8e265]:
              - text: Challenges
              - list [ref=f8e266]:
                - listitem [ref=f8e267]: these are harder to automate, and often impossible to interact with manually without ‘cheating’. Once you have covered the basics by working with the Pages and the Apps you can test your skills with the Challenges
            - listitem [ref=f8e268]:
              - text: Reference
              - list [ref=f8e269]:
                - listitem [ref=f8e270]: a set of reference content that would be overkill to add to the Instructions. This has testing and automation theory, as well as practical hints and tips.
