          - heading "About" [level=2] [ref=f8e277]
          - paragraph [ref=f8e278]:
            - text: I
            - link "(Alan Richardson)" [ref=f8e279] [cursor=pointer]:
              - /url: https://eviltester.com
            - text: created this, because I believe the best way to improve your testing skills is to practice.
          - paragraph [ref=f8e280]: Learning how to practice is a skill that takes time.
          - paragraph [ref=f8e281]: Testing is a rich and varied process. There are many different ways of viewing a system and exploring its functionality. Each exercise and test page will pay dividends on repeat visits.
          - paragraph [ref=f8e282]: The more you learn how to practice, the more value you can get from these pages.
          - paragraph [ref=f8e283]:
            - text: Patreon supporters can download a
            - link "free 205 page ebook of exercises and notes" [ref=f8e284] [cursor=pointer]:
              - /url: https://www.patreon.com/posts/75068248
            - text: based on one of these pages, the
            - link "7 Char Validation application" [ref=f8e285] [cursor=pointer]:
              - /url: /apps/7-char-val/
            - text: .
          - paragraph [ref=f8e286]: The secret to Software Testing is Taking Action. When we are faced with a system that we don’t know, or don’t know how to test, then we try, we explore, we take action.
          - paragraph [ref=f8e287]: "By taking action we learn:"
          - list [ref=f8e288]:
            - listitem [ref=f8e289]: what we don’t know and can then investigate and research to allow us to proceed.
            - listitem [ref=f8e290]: what paths are open to us and we can quickly proceed to exploration.
          - paragraph [ref=f8e291]: We learn by doing.
          - heading "Pages" [level=2] [ref=f8e292]
          - paragraph [ref=f8e293]: Some of the examples are suitable for manual exploratory testing, learning HTML, learning Technical Web Testing, and JavaScript hacking.
          - paragraph [ref=f8e294]: The “Instructions” page for each of the practice pages should provide more hints, tips and possibly sample exercises.
          - heading "Support These Pages" [level=2] [ref=f8e295]
          - paragraph [ref=f8e296]:
            - text: If you find these pages useful then you can support their development and expansion by signing up for our
            - link "Patreon Membership" [ref=f8e297] [cursor=pointer]:
              - /url: https://www.patreon.com/eviltester
            - text: . From as little as $1 a month you gain access to all the online training courses and ebooks on
            - link "TesterHQ.com" [ref=f8e298] [cursor=pointer]:
              - /url: https://www.testerhq.com/
            - text: ", early access to ad-free YouTube videos and podcasts, and regular exclusive posts."
          - paragraph [ref=f8e299]:
            - text: Learn more, and support this site with a
            - link "Patreon Membership" [ref=f8e300] [cursor=pointer]:
              - /url: https://www.patreon.com/eviltester
            - text: .
          - heading "Sponsoring" [level=2] [ref=f8e301]
          - paragraph [ref=f8e302]:
            - text: If you are a company, interested in sponsoring the pages and being promoted on this site then contact
            - link "Alan Richardson via LinkedIn" [ref=f8e303] [cursor=pointer]:
